name = "beansprouts-contact"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = false

[vars]
# Exact origin(s) allowed to post to this Worker. Comma-separated, no trailing
# slash. Add your Pages preview domain here too if you want the form to work
# on previews.
ALLOWED_ORIGIN = "https://beansprouts.dk"

# The PRIVATE repository that receives contact submissions as issues.
# Do not point this at a public repo — issue bodies contain sender names and
# email addresses.
GITHUB_OWNER = "sapieneptus"
GITHUB_REPO = "contact-inbox"

# GITHUB_TOKEN is a secret, never a var:
#   npx wrangler secret put GITHUB_TOKEN

# Optional per-IP rate limiting. Create the namespace, paste the id, uncomment.
#   npx wrangler kv namespace create RATE_LIMIT
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "paste-the-id-wrangler-prints"
